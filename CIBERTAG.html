<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberTag: Overdrive 2026</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #05070a;
            color: #00f0ff;
            font-family: 'Orbitron', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            box-sizing: border-box;
            padding: 20px;
        }

        /* CONTENEDOR MAESTRO PARA PANTALLA COMPLETA */
        #gameWrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 1400px;
        }

        /* Estilos cuando el contenedor maestro entra en Fullscreen */
        #gameWrapper:fullscreen {
            max-width: none;
            width: 100vw;
            height: 100vh;
            background-color: #05070a;
            padding: 30px;
            box-sizing: border-box;
        }

        .header-container {
            display: flex;
            gap: 30px;
            align-items: center;
            margin-bottom: 15px;
            z-index: 5;
        }

        h1 {
            margin: 0;
            font-size: 26px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 10px #00f0ff, 0 0 20px #00f0ff;
            letter-spacing: 2px;
        }

        .timer {
            font-size: 30px;
            font-weight: bold;
            color: #fff;
            background: #ff0055;
            padding: 4px 22px;
            border-radius: 4px;
            box-shadow: 0 0 15px #ff0055;
            border: 1px solid #ff66aa;
        }

        .btn-fullscreen {
            background-color: transparent;
            color: #00f0ff;
            border: 2px solid #00f0ff;
            padding: 8px 18px;
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 0 8px rgba(0, 240, 255, 0.3);
            letter-spacing: 1px;
        }

        .btn-fullscreen:hover {
            background-color: #00f0ff;
            color: #05070a;
            box-shadow: 0 0 20px #00f0ff;
            transform: scale(1.05);
        }

        .status {
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            min-width: 280px;
            text-align: center;
            text-shadow: 0 0 8px currentColor;
        }

        /* Contenedor Proporcional del Canvas */
        .canvas-container {
            position: relative;
            width: 100%;
            max-width: 1400px;
            max-height: calc(100vh - 180px); 
            aspect-ratio: 1400 / 750;
        }

        /* Ajuste dinámico del canvas dentro de la pantalla completa */
        #gameWrapper:fullscreen .canvas-container {
            max-height: calc(100vh - 140px); /* Deja espacio superior para el contador */
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #gameCanvas {
            background-color: #090d16;
            border: 3px solid #00f0ff;
            border-radius: 8px;
            box-shadow: 0 0 35px rgba(0, 240, 255, 0.25);
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Terminal de Recompilación (Menú Final) */
        #menuOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 7, 10, 0.95);
            border-radius: 8px;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            border: 2px solid #ff0055;
            box-shadow: inset 0 0 50px rgba(255, 0, 85, 0.3);
        }

        #menuOverlay h2 {
            font-size: 50px;
            margin: 0 0 10px 0;
            color: #ff0055;
            text-shadow: 0 0 20px #ff0055;
            letter-spacing: 4px;
        }

        #winnerText {
            font-size: 20px;
            margin-bottom: 30px;
            color: #8da2bb;
            letter-spacing: 1px;
        }

        .btn-restart {
            background-color: transparent;
            color: #39ff14;
            border: 2px solid #39ff14;
            font-family: 'Orbitron', sans-serif;
            padding: 14px 35px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.2);
            letter-spacing: 2px;
        }

        .btn-restart:hover {
            background-color: #39ff14;
            color: #05070a;
            box-shadow: 0 0 25px #39ff14;
            transform: scale(1.05);
        }

        .instructions-container {
            display: flex;
            gap: 50px;
            margin-top: 15px;
            background: rgba(9, 13, 22, 0.8);
            padding: 10px 40px;
            border-radius: 6px;
            border: 1px solid #00f0ff;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.1);
            z-index: 5;
        }

        .player-info {
            font-size: 12px;
            line-height: 1.6;
            letter-spacing: 1px;
        }

        .p1-color { color: #ff0055; font-weight: bold; text-shadow: 0 0 5px #ff0055; }
        .p2-color { color: #00f0ff; font-weight: bold; text-shadow: 0 0 5px #00f0ff; }
    </style>
</head>
<body>

    <div id="gameWrapper">
        <div class="header-container">
            <h1>CYBER_TAG // OVERDRIVE</h1>
            <div class="timer" id="timeDisplay">90</div>
            <button class="btn-fullscreen" onclick="toggleFullscreen()">ACCEDER A RED</button>
            <div class="status" id="statusMessage" style="color: #ff0055;">Sujeto_01 porta el núcleo</div>
        </div>
        
        <div class="canvas-container">
            <canvas id="gameCanvas" width="1400" height="750"></canvas>
            
            <div id="menuOverlay">
                <h2 id="endTitle">CRITICAL_ERROR</h2>
                <div id="winnerText">Núcleo sobrecargado. Red reiniciada.</div>
                <button class="btn-restart" onclick="resetGame()">REBOOT_SYSTEM</button>
            </div>
        </div>
    </div>

    <div class="instructions-container">
        <div class="player-info">
            <span class="p1-color">SUJETO 01 (Neon Red):</span><br>
            Ciber-Navegación: <strong>A / D</strong> | Impulsor Vertical: <strong>W</strong> | Hiper-Dash: <strong>A/D + S</strong>
        </div>
        <div class="player-info">
            <span class="p2-color">SUJETO 02 (Neon Cyan):</span><br>
            Ciber-Navegación: <strong>⬅ / ➡</strong> | Impulsor Vertical: <strong>⬆</strong> | Hiper-Dash: <strong>⬅/➡ + ⬇</strong>
        </div>
    </div>

    <script>
        function toggleFullscreen() {
            // Ahora aplicamos el fullscreen al contenedor maestro global
            const target = document.getElementById('gameWrapper');
            if (!document.fullscreenElement) {
                target.requestFullscreen().catch(err => {
                    console.error(`Error de red al activar Fullscreen: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
        }

        window.onload = function() {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const statusMessage = document.getElementById('statusMessage');
            const timeDisplay = document.getElementById('timeDisplay');
            const menuOverlay = document.getElementById('menuOverlay');
            const winnerText = document.getElementById('winnerText');
            const endTitle = document.getElementById('endTitle');

            const gravity = 0.55;
            const friction = 0.88; 

            let timeLeft = 90;
            let gameActive = true;
            let timerInterval = null;
            let particles = []; 

            const platforms = [
                { x: 80, y: 600, width: 260, height: 12 },
                { x: 1060, y: 600, width: 260, height: 12 },
                { x: 500, y: 560, width: 400, height: 12 },
                { x: 280, y: 460, width: 200, height: 12 },
                { x: 920, y: 460, width: 200, height: 12 },
                { x: 550, y: 360, width: 300, height: 12 },
                { x: 50, y: 340, width: 200, height: 12 },
                { x: 1150, y: 340, width: 200, height: 12 },
                { x: 260, y: 220, width: 240, height: 12 },
                { x: 900, y: 220, width: 240, height: 12 },
                { x: 580, y: 140, width: 240, height: 12 }
            ];

            const keys = {};
            window.addEventListener('keydown', (e) => { keys[e.code] = true; });
            window.addEventListener('keyup', (e) => { keys[e.code] = false; });

            class Player {
                constructor(x, y, color, name, isIt) {
                    this.startX = x;
                    this.startY = y;
                    this.color = color;
                    this.name = name;
                    this.startIsIt = isIt;
                    this.init();
                }

                init() {
                    this.x = this.startX;
                    this.y = this.startY;
                    this.width = 32;
                    this.height = 32;
                    this.isIt = this.startIsIt;
                    this.vx = 0;
                    this.vy = 0;
                    this.isGrounded = false;
                    this.facing = 1;
                    this.dashCooldown = 0;
                    this.jumpForce = 15; 
                    this.isExploded = false;
                }

                update(leftKey, rightKey, jumpKey, dashKey) {
                    if (this.isExploded) return;
                    if (this.dashCooldown > 0) this.dashCooldown--;

                    let currentSpeed = this.isIt ? 0.98 : 0.82;
                    let currentMaxSpeed = this.isIt ? 6.4 : 5.6; 

                    if (leftKey) {
                        this.vx -= currentSpeed;
                        this.facing = -1;
                    } else if (rightKey) {
                        this.vx += currentSpeed;
                        this.facing = 1;
                    } else {
                        this.vx *= 0.80; 
                    }

                    if (dashKey && this.dashCooldown === 0 && (leftKey || rightKey)) {
                        this.vx = this.facing * 38;
                        this.dashCooldown = 60; 
                    }

                    this.vx *= friction;

                    if (Math.abs(this.vx) > currentMaxSpeed && this.dashCooldown < 45) {
                        this.vx = Math.sign(this.vx) * currentMaxSpeed;
                    }

                    if (jumpKey && this.isGrounded) {
                        this.vy = -this.jumpForce;
                        this.isGrounded = false;
                    }

                    this.vy += gravity;
                    this.x += this.vx;
                    this.y += this.vy;

                    if (this.x <= 0) { this.x = 0; this.vx = 0; }
                    if (this.x + this.width >= canvas.width) { this.x = canvas.width - this.width; this.vx = 0; }

                    this.isGrounded = false;

                    let groundLimit = canvas.height - this.height;
                    if (this.y >= groundLimit) {
                        this.y = groundLimit;
                        this.vy = 0;
                        this.isGrounded = true;
                    }

                    platforms.forEach(plat => {
                        if (this.x + this.width > plat.x &&
                            this.x < plat.x + plat.width &&
                            this.y + this.height >= plat.y &&
                            this.y + this.height - this.vy <= plat.y + 12) {
                            
                            this.y = plat.y - this.height;
                            this.vy = 0;
                            this.isGrounded = true;
                        }
                    });
                }

                draw() {
                    if (this.isExploded) return;

                    ctx.save();
                    ctx.shadowBlur = 12;
                    ctx.shadowColor = this.color;
                    ctx.fillStyle = this.color;
                    ctx.fillRect(this.x, this.y, this.width, this.height);
                    
                    ctx.fillStyle = "#fff";
                    ctx.fillRect(this.x + 4, this.y + 4, this.width - 8, this.height - 8);
                    ctx.restore();

                    if (this.isIt) {
                        let time = Date.now() * 0.006;
                        let bobbing = Math.sin(time) * 5;
                        let bombX = this.x + this.width / 2;
                        let bombY = this.y - 25 + bobbing;

                        ctx.save();
                        ctx.shadowBlur = 15;
                        ctx.shadowColor = "#ff0055";
                        
                        ctx.beginPath();
                        ctx.arc(bombX, bombY, 9, 0, Math.PI * 2);
                        ctx.fillStyle = '#fff';
                        ctx.fill();
                        
                        ctx.strokeStyle = '#ff0055';
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.arc(bombX, bombY, 16, time, time + Math.PI * 1.5);
                        ctx.stroke();

                        ctx.strokeStyle = '#00f0ff';
                        ctx.lineWidth = 1.5;
                        ctx.beginPath();
                        ctx.arc(bombX, bombY, 22, -time, -time + Math.PI);
                        ctx.stroke();
                        ctx.restore();
                    }

                    if (Math.abs(this.vx) > 7) {
                        ctx.save();
                        ctx.globalAlpha = 0.3;
                        ctx.fillStyle = this.color;
                        ctx.fillRect(this.x - (this.facing * 16), this.y + 2, this.width, this.height - 4);
                        ctx.globalAlpha = 0.1;
                        ctx.fillRect(this.x - (this.facing * 32), this.y + 4, this.width, this.height - 8);
                        ctx.restore();
                    }
                }
            }

            const p1 = new Player(120, 150, '#ff0055', 'Sujeto 01', true);
            const p2 = new Player(1220, 600, '#00f0ff', 'Sujeto 02', false);

            let tagCooldown = 0;

            function startTimer() {
                clearInterval(timerInterval);
                timerInterval = setInterval(() => {
                    if (!gameActive) return;
                    timeLeft--;
                    timeDisplay.textContent = timeLeft;

                    if (timeLeft <= 0) {
                        endGame();
                    }
                }, 1000);
            }

            function createExplosion(x, y) {
                for (let i = 0; i < 110; i++) {
                    particles.push({
                        x: x,
                        y: y,
                        vx: (Math.random() - 0.5) * 22,
                        vy: (Math.random() - 0.5) * 22,
                        size: Math.random() * 5 + 2,
                        color: Math.random() > 0.4 ? '#ff0055' : '#00f0ff',
                        alpha: 1
                    });
                }
            }

            function endGame() {
                gameActive = false;
                clearInterval(timerInterval);
                
                let loser = p1.isIt ? p1 : p2;
                let winner = p1.isIt ? p2 : p1;
                
                loser.isExploded = true;
                createExplosion(loser.x + 16, loser.y + 16);

                endTitle.textContent = "CRITICAL_OVERLOAD";
                winnerText.innerHTML = `Sujeto desintegrado. El canal de datos pertenece a: <span style="color:${winner.color}; text-shadow:0 0 10px ${winner.color}">${winner.name}</span>`;
                menuOverlay.style.display = 'flex';
            }

            window.resetGame = function() {
                timeLeft = 90;
                timeDisplay.textContent = timeLeft;
                gameActive = true;
                tagCooldown = 0;
                particles = [];
                menuOverlay.style.display = 'none';
                
                p1.init();
                p2.init();
                
                statusMessage.textContent = "Sujeto_01 porta el núcleo";
                statusMessage.style.color = p1.color;
                
                startTimer();
            }

            function updateGame() {
                if (!gameActive) {
                    particles.forEach(p => {
                        p.x += p.vx;
                        p.y += p.vy;
                        p.alpha -= 0.015;
                    });
                    particles = particles.filter(p => p.alpha > 0);
                    return;
                }

                p1.update(keys['KeyA'], keys['KeyD'], keys['KeyW'], keys['KeyS']);
                p2.update(keys['ArrowLeft'], keys['ArrowRight'], keys['ArrowUp'], keys['ArrowDown']);

                if (tagCooldown > 0) {
                    tagCooldown--;
                } else {
                    if (p1.x < p2.x + p2.width &&
                        p1.x + p1.width > p2.x &&
                        p1.y < p2.y + p2.height &&
                        p1.y + p1.height > p2.y) {
                        
                        p1.isIt = !p1.isIt;
                        p2.isIt = !p2.isIt;
                        tagCooldown = 60; 

                        if (p1.isIt) {
                            statusMessage.textContent = `${p1.name} porta el núcleo`;
                            statusMessage.style.color = p1.color;
                        } else {
                            statusMessage.textContent = `${p2.name} porta el núcleo`;
                            statusMessage.style.color = p2.color;
                        }
                    }
                }
            }

            function drawGame() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                ctx.save();
                ctx.strokeStyle = "rgba(0, 240, 255, 0.04)";
                ctx.lineWidth = 1;
                for (let x = 0; x < canvas.width; x += 50) {
                    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
                }
                for (let y = 0; y < canvas.height; y += 50) {
                    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
                }
                ctx.restore();

                platforms.forEach(plat => {
                    ctx.save();
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = "#00f0ff";
                    ctx.fillStyle = 'rgba(9, 21, 38, 0.85)';
                    ctx.fillRect(plat.x, plat.y, plat.width, plat.height);
                    ctx.fillStyle = '#00f0ff';
                    ctx.fillRect(plat.x, plat.y, plat.width, 2.5);
                    ctx.restore();
                });

                if (tagCooldown > 0 && Math.floor(tagCooldown / 4) % 2 === 0) {
                    if (p1.isIt) p2.draw(); else p1.draw();
                    if (p1.isIt) p1.draw(); else p2.draw();
                } else {
                    p1.draw();
                    p2.draw();
                }

                particles.forEach(p => {
                    ctx.save();
                    ctx.globalAlpha = p.alpha;
                    ctx.fillStyle = p.color;
                    ctx.fillRect(p.x, p.y, p.size, p.size);
                    ctx.restore();
                });
            }

            function mainLoop() {
                updateGame();
                drawGame();
                requestAnimationFrame(mainLoop);
            }

            startTimer();
            mainLoop();
        };
    </script>
</body>
</html>
